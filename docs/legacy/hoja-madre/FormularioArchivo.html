<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-dark: #2c3e50; --bg-light: #34495e; --text-primary: #ecf0f1;
        --text-secondary: #bdc3c7; --accent-blue: #3498db; --accent-blue-hover: #2980b9;
        --accent-green: #2ecc71; --accent-green-hover: #27ae60; --accent-red: #e74c3c;
        --accent-red-hover: #c0392b;
      }
      html, body {
        margin: 0; padding: 0; font-family: 'Roboto', sans-serif;
        background-color: var(--bg-dark); color: var(--text-primary);
      }
      .container { padding: 20px; }
      .form-group { margin-bottom: 20px; }
      label, h4 {
        display: block; margin-bottom: 8px; font-weight: 500; font-size: 12px;
        text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.5px;
      }
      h4 { margin-top: 25px; }
      input, select {
        width: 100%; padding: 10px; box-sizing: border-box; background-color: var(--bg-light);
        color: var(--text-primary); border: none; border-bottom: 2px solid var(--bg-light);
        border-radius: 4px; font-size: 14px; transition: border-color 0.3s ease;
      }
      input[type="date"] { color-scheme: dark; }
      input:focus, select:focus { outline: none; border-bottom-color: var(--accent-blue); }
      button {
        width: 100%; padding: 12px; border: none; border-radius: 5px; font-family: 'Roboto', sans-serif;
        font-size: 14px; font-weight: bold; text-transform: uppercase; cursor: pointer;
        transition: all 0.2s ease-in-out; display: flex; align-items: center; justify-content: center;
      }
      button:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
      .btn-primary { background-color: var(--accent-blue); color: white; margin-top: 10px; }
      .btn-primary:hover { background-color: var(--accent-blue-hover); }
      .btn-success { background-color: var(--accent-green); color: white; }
      .btn-success:hover { background-color: var(--accent-green-hover); }
      .btn-danger { background-color: var(--accent-red); color: white; }
      .btn-danger:hover { background-color: var(--accent-red-hover); }
      .buttons { display: flex; gap: 10px; margin-top: 20px; }
      #pending-list { list-style-type: none; padding: 0; margin: 0; }
      #pending-list li {
        background-color: var(--bg-light); padding: 10px 15px; border-radius: 4px;
        margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
        font-size: 14px;
      }
      .remove-item {
        color: var(--text-secondary); cursor: pointer; font-weight: bold; padding: 5px; border-radius: 50%;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      .remove-item:hover { background-color: var(--accent-red); color: white; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="form-group">
        <label for="alumno">Seleccionar Alumno</label>
        <select id="alumno"><option value="">Cargando...</option></select>
      </div>
      <div class="form-group">
        <label for="programa">Seleccionar Programa</label>
        <select id="programa"><option value="">Cargando...</option></select>
      </div>
      <div class="form-group">
        <label for="fechaInicio">Fecha de Inicio</label>
        <input type="date" id="fechaInicio">
      </div>
      <button id="add-btn" class="btn-primary">Añadir a la lista</button>
      <div id="pending-container">
        <h4>Archivos a crear:</h4>
        <ul id="pending-list"></ul>
      </div>
      <div class="buttons">
        <button id="execute-btn" class="btn-success">Crear Todos</button>
        <button id="close-btn" class="btn-danger">Cerrar</button>
      </div>
    </div>
    <script>
      let archivosPendientes = [];

      document.addEventListener("DOMContentLoaded", () => {
        google.script.run.withSuccessHandler(poblarAlumnos).obtenerListaDeAlumnos();
        google.script.run.withSuccessHandler(poblarProgramas).obtenerListaDeProgramas();
      });

      function poblarAlumnos(lista) {
        const select = document.getElementById("alumno");
        select.innerHTML = '<option value="" disabled selected>-- Elige un alumno --</option>';
        lista.forEach(item => select.add(new Option(item, item)));
      }

      function poblarProgramas(lista) {
        const select = document.getElementById("programa");
        select.innerHTML = '<option value="" disabled selected>-- Elige un programa --</option>';
        lista.forEach(item => select.add(new Option(item.nombre, item.id)));
      }

      function renderizarLista() {
        const list = document.getElementById("pending-list");
        list.innerHTML = "";
        archivosPendientes.forEach((item, index) => {
          const li = document.createElement("li");
          const textNode = document.createTextNode(`${item.alumno} (${item.programaNombre})`);
          const removeSpan = document.createElement("span");
          removeSpan.textContent = "×";
          removeSpan.className = "remove-item";
          removeSpan.onclick = () => removeItem(index);
          li.appendChild(textNode);
          li.appendChild(removeSpan);
          list.appendChild(li);
        });
      }

      function removeItem(index) {
        archivosPendientes.splice(index, 1);
        renderizarLista();
      }

      document.getElementById("add-btn").addEventListener("click", () => {
        const alumnoSelect = document.getElementById("alumno");
        const programaSelect = document.getElementById("programa");
        const fechaInput = document.getElementById("fechaInicio");

        const datos = {
          alumno: alumnoSelect.value,
          programaId: programaSelect.value,
          programaNombre: programaSelect.options[programaSelect.selectedIndex].text,
          fechaInicio: fechaInput.value
        };

        if (!datos.alumno || !datos.programaId || !datos.fechaInicio) {
          alert("Debes completar todos los campos.");
          return;
        }
        
        archivosPendientes.push(datos);
        renderizarLista();
        
        // Opcional: limpiar campos después de añadir
        alumnoSelect.selectedIndex = 0;
        programaSelect.selectedIndex = 0;
        fechaInput.value = "";
      });

      document.getElementById("execute-btn").addEventListener("click", () => {
        if (archivosPendientes.length === 0) {
          alert("No hay archivos en la lista para crear.");
          return;
        }
        
        const btn = document.getElementById("execute-btn");
        btn.disabled = true;
        btn.textContent = "Creando...";
        
        google.script.run
          .withSuccessHandler(resultado => {
            alert(resultado);
            google.script.host.close();
          })
          .withFailureHandler(err => {
            alert("Error: " + err.message);
            btn.disabled = false;
            btn.textContent = "Crear Todos";
          })
          .procesarCreacionMasiva(archivosPendientes);
      });

      document.getElementById("close-btn").addEventListener("click", () => {
        google.script.host.close();
      });
    </script>
  </body>
</html>
