<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-dark: #2c3e50; --bg-light: #34495e; --text-primary: #ecf0f1;
        --text-secondary: #bdc3c7; --accent-green: #2ecc71; --accent-green-hover: #27ae60;
        --accent-red: #e74c3c; --accent-red-hover: #c0392b;
      }
      html, body {
        margin: 0; padding: 0; font-family: 'Roboto', sans-serif;
        background-color: var(--bg-dark); color: var(--text-primary);
      }
      .container { padding: 20px; }
      h3 {
        font-weight: 500; text-align: center; color: var(--text-primary);
        border-bottom: 1px solid var(--bg-light); padding-bottom: 10px; margin-top: 0;
      }
      .form-group { margin-bottom: 20px; }
      label {
        display: block; margin-bottom: 8px; font-weight: 500; font-size: 12px;
        text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.5px;
      }
      input[type="text"] {
        width: 100%; padding: 10px; box-sizing: border-box; background-color: var(--bg-light);
        color: var(--text-primary); border: none; border-bottom: 2px solid var(--bg-light);
        border-radius: 4px; font-size: 14px; transition: border-color 0.3s ease;
      }
      input[type="text"]:focus { outline: none; border-bottom-color: var(--accent-green); }
      .button-container { display: flex; gap: 10px; margin-top: 25px; }
      button {
        flex-grow: 1; padding: 12px; border: none; border-radius: 5px; font-family: 'Roboto', sans-serif;
        font-size: 14px; font-weight: bold; text-transform: uppercase; cursor: pointer;
        transition: all 0.2s ease-in-out;
      }
      button:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
      .btn-success { background-color: var(--accent-green); color: white; }
      .btn-success:hover { background-color: var(--accent-green-hover); }
      .btn-danger { background-color: var(--accent-red); color: white; }
      .btn-danger:hover { background-color: var(--accent-red-hover); }
    </style>
  </head>
  <body>
    <div class="container">
      <h3>Añadir Nuevo Alumno</h3>
      <div class="form-group">
        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido">
      </div>
      <div class="form-group">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre">
      </div>
      <div class="button-container">
        <button id="btn-cancel" class="btn-danger">Cancelar</button>
        <button id="btn-add" class="btn-success">Añadir</button>
      </div>
    </div>
    <script>
      document.getElementById("btn-add").addEventListener("click", function() {
        var apellido = document.getElementById("apellido").value;
        var nombre = document.getElementById("nombre").value;
        if (!apellido || !nombre) { alert("Debes completar ambos campos."); return; }
        this.disabled = true;
        this.textContent = "Añadiendo...";
        google.script.run
          .withSuccessHandler(google.script.host.close)
          .procesarNuevoAlumno({ apellido: apellido, nombre: nombre });
      });
      document.getElementById("btn-cancel").addEventListener("click", () => {
        google.script.host.close();
      });
    </script>
  </body>
</html>
