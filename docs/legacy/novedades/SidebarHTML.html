<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-dark: #2c3e50; --bg-light: #34495e; --text-primary: #ecf0f1;
        --text-secondary: #bdc3c7; --accent-blue: #3498db; --accent-blue-hover: #2980b9;
        --accent-green: #2ecc71; --accent-green-hover: #27ae60; --accent-red: #e74c3c;
        --accent-red-hover: #c0392b;
      }
      html, body {
        margin: 0; padding: 0; font-family: 'Roboto', sans-serif;
        background-color: var(--bg-dark); color: var(--text-primary);
      }
      .container { padding: 20px; }
      .form-group { margin-bottom: 20px; }
      label, h4 {
        display: block; margin-bottom: 8px; font-weight: 500; font-size: 12px;
        text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.5px;
      }
      h4 { margin-top: 25px; }
      input, select {
        width: 100%; padding: 10px; box-sizing: border-box; background-color: var(--bg-light);
        color: var(--text-primary); border: none; border-bottom: 2px solid var(--bg-light);
        border-radius: 4px; font-size: 14px; transition: border-color 0.3s ease;
      }
      input:focus, select:focus { outline: none; border-bottom-color: var(--accent-blue); }
      button {
        width: 100%; padding: 12px; border: none; border-radius: 5px; font-family: 'Roboto', sans-serif;
        font-size: 14px; font-weight: bold; text-transform: uppercase; cursor: pointer;
        transition: all 0.2s ease-in-out; display: flex; align-items: center; justify-content: center;
      }
      button:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
      .btn-primary { background-color: var(--accent-blue); color: white; }
      .btn-primary:hover { background-color: var(--accent-blue-hover); }
      .btn-success { background-color: var(--accent-green); color: white; }
      .btn-success:hover { background-color: var(--accent-green-hover); }
      .btn-danger { background-color: var(--accent-red); color: white; }
      .btn-danger:hover { background-color: var(--accent-red-hover); }
      .buttons { display: flex; gap: 10px; margin-top: 20px; }
      #pending-list {
        list-style-type: none; padding: 0; margin: 0;
      }
      #pending-list li {
        background-color: var(--bg-light); padding: 10px 15px; border-radius: 4px;
        margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
        font-size: 14px;
      }
      .remove-item {
        color: var(--text-secondary); cursor: pointer; font-weight: bold;
        padding: 5px; border-radius: 50%;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      .remove-item:hover { background-color: var(--accent-red); color: white; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="form-group">
        <label for="product-select">Producto</label>
        <select id="product-select">
          <option>Cargando productos...</option>
        </select>
      </div>
      <div class="form-group">
        <label for="quantity-input">Cantidad a Añadir</label>
        <input type="number" id="quantity-input" min="1" value="1">
      </div>
      <button id="add-btn" class="btn-primary">Añadir a la lista</button>
      <div id="pending-container">
        <h4>Pendiente para ejecutar:</h4>
        <ul id="pending-list"></ul>
      </div>
      <div class="buttons">
        <button id="execute-btn" class="btn-success">Ejecutar</button>
        <button id="close-btn" class="btn-danger">Cerrar</button>
      </div>
    </div>
    <script>
      // El código JavaScript no necesita cambios
      let pendingUpdates = [];
      document.addEventListener("DOMContentLoaded", () => {
        google.script.run.withSuccessHandler(populateProductDropdown).getProductList();
      });
      function populateProductDropdown(products) {
        const select = document.getElementById("product-select");
        select.innerHTML = "";
        if (products && products.length > 0) {
          products.forEach(product => {
            const option = document.createElement("option");
            option.value = product;
            option.textContent = product;
            select.appendChild(option);
          });
        } else {
          select.innerHTML = "<option>No se encontraron productos</option>";
        }
      }
      document.getElementById("add-btn").addEventListener("click", () => {
        const product = document.getElementById("product-select").value;
        const quantity = parseInt(document.getElementById("quantity-input").value, 10);
        if (!product || isNaN(quantity) || quantity <= 0) { alert("Por favor, selecciona un producto y una cantidad válida."); return; }
        const existingItem = pendingUpdates.find(item => item.product === product);
        if (existingItem) { existingItem.quantity += quantity; } else { pendingUpdates.push({ product, quantity }); }
        renderPendingList();
        document.getElementById("quantity-input").value = "1";
      });
      function renderPendingList() {
        const list = document.getElementById("pending-list");
        list.innerHTML = "";
        pendingUpdates.forEach((item, index) => {
          const li = document.createElement("li");
          const textNode = document.createTextNode(`${item.product}: ${item.quantity} unidades`);
          const removeSpan = document.createElement("span");
          removeSpan.textContent = "×";
          removeSpan.className = "remove-item";
          removeSpan.onclick = () => removeItem(index);
          li.appendChild(textNode);
          li.appendChild(removeSpan);
          list.appendChild(li);
        });
      }
      function removeItem(index) {
        pendingUpdates.splice(index, 1);
        renderPendingList();
      }
      document.getElementById("execute-btn").addEventListener("click", () => {
        if (pendingUpdates.length === 0) { alert("No hay productos en la lista para ejecutar."); return; }
        const confirmationMessage = `¿Estás seguro de que deseas actualizar el stock de ${pendingUpdates.length} producto(s)?`;
        if (confirm(confirmationMessage)) {
          document.getElementById("execute-btn").disabled = true;
          document.getElementById("execute-btn").textContent = "Procesando...";
          google.script.run.withSuccessHandler(onExecuteSuccess).updateStockLevels(pendingUpdates);
        }
      });
      function onExecuteSuccess(summaryMessage) {
        alert(summaryMessage);
        google.script.host.close();
      }
      document.getElementById("close-btn").addEventListener("click", () => {
        google.script.host.close();
      });
    </script>
  </body>
</html>
