<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      /* --- Paleta de Colores Modernos --- */
      :root {
        --bg-dark: #2c3e50;
        --bg-light: #34495e;
        --text-primary: #ecf0f1;
        --text-secondary: #bdc3c7;
        --accent-blue: #3498db;
        --accent-blue-hover: #2980b9;
        --border-color: #8e44ad;
      }

      /* --- Estilos Generales --- */
      html, body {
        margin: 0;
        padding: 0;
        font-family: 'Roboto', sans-serif;
        background-color: var(--bg-dark);
        color: var(--text-primary);
      }
      .container {
        padding: 20px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        font-size: 12px;
        text-transform: uppercase;
        color: var(--text-secondary);
        letter-spacing: 0.5px;
      }

      /* --- Estilos para Inputs y Selectores --- */
      input[type="text"], select {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        background-color: var(--bg-light);
        color: var(--text-primary);
        border: none;
        border-bottom: 2px solid var(--bg-light);
        border-radius: 4px;
        font-size: 14px;
        transition: border-color 0.3s ease;
      }
      input[type="text"]:focus, select:focus {
        outline: none;
        border-bottom-color: var(--accent-blue);
      }
      input[type="text"] {
        margin-bottom: 8px;
      }
      select[size] {
        border: 2px solid var(--bg-light);
      }
      select option {
        padding: 5px;
      }
      
      /* --- Estilos para el Botón --- */
      button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        background-color: var(--accent-blue);
        color: #ffffff;
        border: none;
        border-radius: 5px;
        font-family: 'Roboto', sans-serif;
        font-size: 14px;
        font-weight: bold;
        text-transform: uppercase;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease-in-out;
      }
      button:hover {
        background-color: var(--accent-blue-hover);
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      }
      button:disabled {
        background-color: #555;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      /* --- Estilos para el Mensaje de Estado --- */
      #status {
        margin-top: 20px;
        font-style: italic;
        color: var(--text-secondary);
        text-align: center;
        min-height: 20px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="form-group">
        <label for="alumno-select">Alumno</label>
        <input type="text" id="alumno-search" placeholder="Buscar alumno...">
        <select id="alumno-select" size="8">
          <option value="" disabled selected>Cargando alumnos...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="accion-select">Acción a Realizar</label>
        <select id="accion-select">
          <option value="actualizar_rutina">Actualizar rutina</option>
          <option value="volver_1_semana">Volver a semana pasada</option>
          <option value="volver_2_semanas">Volver 2 semanas</option>
          <option value="volver_3_semanas">Volver 3 semanas</option>
          <option value="ausencia_larga">Protocolo de Ausencia</option>
          <option value="crear_boton">Crear/Actualizar Botón</option>
          <option value="cargar_rms">Cargar RMs</option>
        </select>
      </div>

      <button id="ejecutar-btn" class="action">Ejecutar</button>

      <div id="status"></div>
    </div>

    <script>
      let todosLosAlumnos = []; 

      document.addEventListener("DOMContentLoaded", function() {
        google.script.run.withSuccessHandler(function(alumnos) {
          todosLosAlumnos = alumnos; 
          poblarAlumnos(todosLosAlumnos); 
        }).obtenerAlumnosConId();
      });

      function poblarAlumnos(alumnos) {
        const select = document.getElementById("alumno-select");
        select.innerHTML = ''; 
        if (alumnos.length === 0) {
          select.innerHTML = '<option value="" disabled selected>No se encontraron alumnos</option>';
          return;
        }
        alumnos.forEach(function(alumno) {
          const option = document.createElement("option");
          option.value = alumno.id;
          option.textContent = alumno.nombre;
          select.appendChild(option);
        });
      }

      document.getElementById("alumno-search").addEventListener("input", function() {
        const textoBusqueda = this.value.toLowerCase();
        const alumnosFiltrados = todosLosAlumnos.filter(function(alumno) {
          return alumno.nombre.toLowerCase().includes(textoBusqueda);
        });
        poblarAlumnos(alumnosFiltrados);
      });

      document.getElementById("ejecutar-btn").addEventListener("click", function() {
        const alumnoSelect = document.getElementById("alumno-select");
        const accionSelect = document.getElementById("accion-select");
        const statusDiv = document.getElementById("status");
        
        if (!alumnoSelect.value) {
          statusDiv.textContent = "Por favor, selecciona un alumno.";
          return;
        }

        this.disabled = true;
        statusDiv.textContent = "Procesando, por favor espera...";

        const datos = {
          alumnoId: alumnoSelect.value,
          accion: accionSelect.value
        };

        google.script.run.withSuccessHandler(function(mensaje) {
          statusDiv.textContent = `Resultado: ${mensaje}`;
          document.getElementById("ejecutar-btn").disabled = false;
        }).withFailureHandler(function(error) {
          statusDiv.textContent = `Error: ${error.message}`;
          document.getElementById("ejecutar-btn").disabled = false;
        }).procesarAccionPanel(datos);
      });
    </script>
  </body>
</html>
